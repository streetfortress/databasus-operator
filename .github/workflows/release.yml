# Release artifacts off vX.Y.Z tags: the image →
# ghcr.io/<owner>/databasus-operator:vX.Y.Z, then the Helm chart →
# oci://ghcr.io/<owner>/charts/databasus-operator at X.Y.Z, then the GitHub
# Release, which carries install.yaml and the commit subjects since the
# previous tag. Modeled on oss/s3-exporter's .github/workflows/release.yml.
#
# The owner comes from github.repository_owner and not from a literal. A
# transfer of the repository then needs no change here. A literal is what
# made the by-hand fix of #14 necessary.
#
# Lockstep versioning: the tag stamps every artifact, and no artifact keeps
# its version in a committed file. The chart takes version = appVersion =
# ${TAG#v}. The image tag keeps the v, because the chart's default image tag
# is "v" plus the appVersion (templates/_helpers.tpl) and v0.1.0 is published
# as v0.1.0. s3-exporter drops the v on both sides instead. Each repository
# picks one of the two and uses it for the chart and for the image together.
#
# The chart goes under charts/, one level below the image. An OCI registry
# keys an artifact by path and tag and ignores the type, so a chart that goes
# to the image's own path replaces the image (s3-exporter v1.0.0 did exactly
# that). The charts/ path makes that impossible.
#
# Each job waits for the one before it: the chart never names an image tag
# that does not exist, and the Release never claims an artifact that failed
# to push.
#
# This workflow runs on GitHub only. gitea.zen.lofi/oss/databasus-operator is
# the source of truth; the ref-pusher of sfi/deployments (#612) carries
# refs/heads/main and refs/tags/v* to
# github.com/streetfortress/databasus-operator. That push carries a GitHub
# App installation token, not a workflow's GITHUB_TOKEN, so it triggers this
# workflow. The installation token needs `workflows: write` to push a ref
# that changes this file, and the allowlist of the ref-pusher must name
# refs/tags/v* or no tag reaches GitHub. Gitea Actions never sees this file:
# .gitea/workflows/ exists, so gitea does not fall back to .github/workflows.
#
# Cut a release with `just tag X.Y.Z` from the repo root. It checks semver,
# it refuses unless HEAD is exactly origin/main, and it pushes the tag to
# gitea. The ref-pusher reconciles on an interval, so this workflow starts
# after that delay and not at once.
#
# GHCR auth is the workflow's own GITHUB_TOKEN (packages: write below) — no
# other secret. GHCR creates a package private and gives no API for the
# change, so a person must make the packages databasus-operator and
# charts/databasus-operator public once, after the first tag under the new
# owner. The old ghcr.io/sf1tzp packages stay as they are; v0.1.0 lives
# there and the fleet still pulls it.
#
# The image carries `latest` beside the version. Pin the version in anything
# that reconciles; `latest` is for a person who tries the operator by hand.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 and arm64. The Dockerfile cross-compiles the manager from
      # $BUILDPLATFORM, so the arm64 leg needs no QEMU and costs the same as
      # the amd64 one.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/databasus-operator:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/databasus-operator:latest

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      - name: Package and push the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          CHART=charts/databasus-operator
          NAME=$(sed -n 's/^name: //p' "$CHART/Chart.yaml")
          helm package "$CHART" --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/$NAME-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

  # The Release body is a constant install paragraph and then the commit
  # subjects since the previous tag. databasus-operator writes no per-release
  # intro by hand, unlike sfi/moment-tally: a person reviews every merge to
  # main and cuts every tag, and the install steps do not change per release.
  #
  # `contents: write` sits on this job alone. `gh release create` needs it;
  # the image job and the chart job keep the read-only token of the workflow.
  release:
    runs-on: ubuntu-latest
    needs: chart
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — the default checkout takes one commit and no tags,
      # and cannot walk PREV..TAG.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the install manifest pinned to this release's image
        run: make build-installer IMG=ghcr.io/${{ github.repository_owner }}/databasus-operator:${{ github.ref_name }}

      - name: Publish the GitHub Release with the manifest attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          # `git describe` on the tag itself returns the tag, and the range
          # is then empty — ask for the tag's parent. The first release has
          # no previous tag, so the command can fail: PREV is then empty and
          # the range is every ancestor. The history of this repository starts
          # at its own `kubebuilder init`, so that range needs no floor
          # commit (s3-exporter is a fork and needs one).
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [[ -n "$PREV" ]]; then
            RANGE="$PREV..$TAG"
            SINCE="since $PREV"
          else
            RANGE="$TAG"
            SINCE="since the first commit"
          fi

          # A trailing (#N) is the number of a gitea pull request. GitHub
          # numbers its own issues and pull requests, so the reference
          # autolinks to the wrong thread there.
          {
            echo "Install: \`kubectl apply -f install.yaml\`, or:"
            echo
            echo '```sh'
            echo "helm install databasus-operator oci://ghcr.io/$OWNER/charts/databasus-operator --version $VERSION"
            echo '```'
            echo
            echo "Check the README compatibility matrix for the supported databasus versions."
            echo
            echo "### Changes $SINCE"
            echo
            git log --no-merges --format='- %s' "$RANGE" | sed -E 's/( \(#[0-9]+\))+$//'
          } > notes.md

          gh release create "$TAG" dist/install.yaml \
              --title "databasus-operator $TAG" --notes-file notes.md
